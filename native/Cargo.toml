[package]
name = "livy-native"
version = "1.0.0"
edition = "2021"
description = "Livy native audio processing (Node-API bindings)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
url = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
